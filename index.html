<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/Logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Noach Helping Hands Foundation | Empowering Communities</title>

    <!-- Basic SEO -->
    <meta
      name="description"
      content="Noach Helping Hands Foundation is dedicated to empowering communities through outreach, education,   and entrepreneurial support in Nigeria."
    />
    <meta
      name="keywords"
      content="Noach Helping Hands Foundation, Outreach, Empowerment, Nigeria,   Community Development, Education, NGO, Nonprofit, Plateau State"
    />
    <meta name="author" content="Noach Helping Hands Foundation" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:title"
      content="Noach Helping Hands Foundation | Empowering Communities"
    />
    <meta
      property="og:description"
      content="Join us in transforming lives through outreach, education,   and entrepreneurial development. Together, we empower communities for a better future."
    />
    <meta
      property="og:image"
      content="https://https://www.noachfoundation.org/images/Logo.jpg"
    />
    <meta property="og:url" content="https://https://www.noachfoundation.org" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noach Helping Hands Foundation" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Noach Helping Hands Foundation | Empowering Communities"
    />
    <meta
      name="twitter:description"
      content="Outreach, empowerment,   and education for community transformation in Nigeria."
    />
    <meta
      name="twitter:image"
      content="https://https://www.noachfoundation.org/images/Logo.jpg"
    />
    <meta name="twitter:site" content="@YourTwitterHandle" />

    <!-- Instagram (uses Open Graph tags) -->
    <!-- No extra tags needed since IG pulls from OG tags -->

    <!-- Favicons / Progressive Web -->
    <link rel="apple-touch-icon" href="/images/Logo.jpg" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
